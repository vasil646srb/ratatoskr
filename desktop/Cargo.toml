[package]
name = "yggproxy"
version = "0.1.13"
edition = "2024"
description = "YggProxy for Linux and Windows: internet through Yggdrasil (VPN client, exit server, console and GUI)"
license = "MIT"

[features]
default = ["gui"]
# The desktop window (egui). Servers can build without it: cargo build --no-default-features
gui = ["dep:eframe", "dep:wgpu"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
qrcode = { version = "0.14", default-features = false }
# Public peer list download: HTTPS in-process (rustls + Mozilla roots), no curl/wget.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
# Tracker: an embedded Yggdrasil node (yggdrasil-ng as a library, pinned) and a TCP stack of
# its own on top of it, so the tracker needs no yggdrasil-go, TUN or root.
yggdrasil = { git = "https://github.com/Revertron/Yggdrasil-ng", rev = "c3a3aa65e2eb14687f087adae9e0a35a7d7ce915", default-features = false }
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv6", "socket-tcp"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
eframe = { version = "0.33", optional = true, default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }

[target.'cfg(windows)'.dependencies]
# Windows: wgpu draws the window through DirectX 12 (in a VM without 3D, through WARP, the
# software rasterizer), with Vulkan and OpenGL ES as fallbacks; glow (OpenGL 2.0+) stays
# selectable with YGGPROXY_RENDERER=glow. The basic display driver of a VM has only OpenGL 1.1.
eframe = { version = "0.33", optional = true, default-features = false, features = ["glow", "wgpu", "default_fonts"] }
wgpu = { version = "27", optional = true, default-features = false, features = ["dx12", "vulkan", "gles", "wgsl"] }
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }
windows-service = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3
